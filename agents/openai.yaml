interface:
  display_name: "Git Smart Commit ZQH"
  short_description: "User choices for atomic commits, branch, and push"
  default_prompt: "Use $git-smart-commit-zqh to review and group my changes, offer two Conventional Commit messages per group for my explicit choice, always invoking an interactive selection tool when available and callable, using numbered chat options only when unavailable, and waiting for my explicit selection at every step, choose one existing or type/description branch for the batch, and let me select local commit, commit-and-push, or no commit."
